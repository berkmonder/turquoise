# The API (backend/): on pushes and pull requests, ruff, ty and the tests must pass; on main, its image
# is then built, started against a throwaway Postgres (it must answer /api/health, as on the server) and
# published to GitHub's registry (ghcr.io/berkmonder/turquoise). The VPS copies each new version into
# its own registry, runs it within ~4 minutes and goes back to the previous image if it doesn't get
# healthy there (nix-dotfiles: hosts/vps/apps.nix).
name: api
on:
  push:
    branches: [main]
    paths: [backend/**, .github/workflows/api.yml]
  pull_request:
    paths: [backend/**, .github/workflows/api.yml]
  workflow_dispatch:
permissions:
  contents: read
env:
  IMAGE: ghcr.io/berkmonder/turquoise
jobs:
  checks:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --frozen
      - name: ruff
        run: uvx ruff@0.16.9 check .
      - name: ty
        run: uvx ty@0.0.84 check .
      - name: tests
        run: uv run pytest -q
  deploy:
    needs: checks
    if: github.event_name != 'pull_request'
    concurrency:
      group: deploy-api
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # publish the image (with this run's own token; nothing stored)
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          podman build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} backend
      - name: Start it with a database and check it answers
        run: |
          podman network create smoke
          podman run -d --network smoke --name db -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=turquoise docker.io/library/postgres:17-alpine
          podman run -d --network smoke --name smoke -e DATABASE_URL=postgresql://postgres:smoke@db:5432/turquoise "$IMAGE:latest"
          for _ in $(seq 60); do
            podman exec smoke python -c "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=5)" && exit 0
            sleep 2
          done
          podman logs smoke
          exit 1
      - name: Publish
        run: |
          podman login ghcr.io -u "${{ github.actor }}" --password-stdin <<<"${{ secrets.GITHUB_TOKEN }}"
          podman push "$IMAGE:${{ github.sha }}"
          podman push "$IMAGE:latest"
