[project]
name = "turquoise"
version = "2.0.0"
description = "Turquoise: live demos of production ML systems (an LLM agent, real-time anomaly detection) and their API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic-settings>=2.4",
  "sqlmodel>=0.0.22",
  "psycopg[binary]>=3.2",
  "numpy>=2.0",
  "rank-bm25>=0.2.2",
  "fastembed>=0.4",
  "onnxruntime>=1.20",  # Chronos-Bolt (fastembed has it too)
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ty.src]
exclude = ["scripts/"]  # run at build time, with PyTorch (export_chronos.py)
