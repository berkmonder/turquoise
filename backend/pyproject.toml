[project]
name = "turquoise"
version = "3.0.0"
description = "Turquoise: Berk's assistant, an agent with tools and RAG over Berk's CV and website"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic-settings>=2.4",
  "numpy>=2.0",
  "rank-bm25>=0.2.2",
  "fastembed>=0.4",
  "pydantic-ai-slim[openai]==2.64.0",
  "mlflow-skinny==3.17.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

